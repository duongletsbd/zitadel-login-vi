name: build-and-push

# Builds the Vietnamese Login V2 image and pushes it to GHCR.
#   - push a tag `v*`      -> builds that version, tags the image `:<ver>` + `:latest`
#   - push to `main`       -> rebuilds the default version (keeps `:latest` fresh)
#   - manual dispatch      -> build any Zitadel version on demand
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      zitadel_version:
        description: 'Zitadel release tag to build from (e.g. v4.15.3)'
        required: true
        default: 'v4.15.3'

env:
  DEFAULT_ZITADEL_VERSION: v4.15.3
  IMAGE_NAME: zitadel-login-vi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Free extra disk — the full pnpm workspace + nx build is large.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker image prune -af || true

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.zitadel_version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="${DEFAULT_ZITADEL_VERSION}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            ZITADEL_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.ver.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
